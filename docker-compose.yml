services:
  worlds-api:
    build: .
    ports: ["8080:8080"]
    environment:
      # Passed through from the invoking shell — export a key of your own
      # choosing before `docker compose up`. No admin key is written into this
      # file.
      - WORLDS_API_ADMIN_KEY
    # worlds-api storage is bound at deploy time (Cloudflare D1); the
    # container no longer accepts a Turso/LibSQL URL via environment.