name: code-health
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: File length (enforced; 120 src / 300 test, blank/comment/import lines excluded)
        run: |
          # Counts lines of code. Skips blank and comment lines and every import /
          # re-export statement, including ones a formatter wrapped over several
          # lines. A plain `export { a, b };` or `export const` is still counted.
          cat > "$RUNNER_TEMP/count.awk" <<'AWK'
          function fromline(s) { return s ~ /from[ \t]*["'][^"']*["']/ }
          inimp { if (fromline($0)) inimp = 0; next }
          inexp { pend++; if (fromline($0)) { inexp = 0; pend = 0 } else if ($0 ~ /^[ \t]*\}/) { inexp = 0; n += pend; pend = 0 } ; next }
          /^[ \t]*($|\/\/|\/\*|\*)/ { next }
          /^[ \t]*import[ \t({"']/ { if (!fromline($0) && $0 !~ /^[ \t]*import[ \t]*["']/ && $0 !~ /^[ \t]*import\(/) inimp = 1; next }
          /^[ \t]*export[ \t]+(type[ \t]+)?\{/ || /^[ \t]*export[ \t]+\*/ {
            if (fromline($0)) next
            if ($0 ~ /\}[ \t]*;?[ \t]*$/) { n++; next }
            inexp = 1; pend = 1; next }
          { n++ }
          END { print n + 0 }
          AWK
          # Files allowed over their limit, one path per line. This list may only
          # shrink: never add a file here, split it instead. Empty today.
          cat > "$RUNNER_TEMP/allowlist.txt" <<'ALLOW'
          ALLOW
          : > "$RUNNER_TEMP/over.txt"
          git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' \
            | grep -vE '(^|/)(node_modules|dist|generated|fixtures|\.next)/|\.d\.ts$|\.gen\.|openapi|snapshot|schema' \
            | while read -r f; do
                n=$(awk -f "$RUNNER_TEMP/count.awk" "$f")
                case "$f" in *.test.*|*.spec.*|*/tests/*|tests/*) max=300;; *) max=120;; esac
                if [ "$n" -gt "$max" ]; then
                  if grep -qxF "$f" "$RUNNER_TEMP/allowlist.txt"; then
                    echo "::warning file=$f::$n lines of code (limit $max), allowlisted"
                  else
                    echo "::error file=$f::$n lines of code (limit $max)"
                    echo "- \`$f\`: $n (limit $max)" >> "$GITHUB_STEP_SUMMARY"
                    echo "$f" >> "$RUNNER_TEMP/over.txt"
                  fi
                fi
              done
          if [ -s "$RUNNER_TEMP/over.txt" ]; then
            echo "Files over the line limit; split them instead of raising the limit:"
            cat "$RUNNER_TEMP/over.txt"
            exit 1
          fi
      - name: TODO/FIXME without an issue link (warn-only)
        run: |
          git grep -nE '\b(TODO|FIXME)\b' -- '*.ts' '*.tsx' '*.js' '*.mjs' ':!*generated*' \
            | grep -vE '#[0-9]+|/issues/[0-9]+' \
            | while IFS=: read -r f l _; do echo "::warning file=$f,line=$l::TODO/FIXME without an issue link"; done || true
