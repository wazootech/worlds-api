name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required for the Infisical OIDC exchange (secrets-action method: oidc). No
  # long-lived Infisical token is stored in GitHub.
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  publish-image:
    # PAUSED: this container image cannot obtain a Cloudflare D1 binding and has
    # been inert since the Turso->D1 migration. The official Docker story now lives
    # in wazootech/wazoo-docker. Re-enable only if a real container use case demands it.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  # The deploy jobs fetch no secrets. `wrangler deploy` uploads code and sets
  # no secrets; the deployed Worker's copy is pushed continuously by the
  # Infisical Cloudflare Workers Secret Sync. Injecting prod values into a job
  # that cannot use them would only widen exposure. `health-qa` is the one job
  # that genuinely needs a secret, so it is the one job that fetches.
  deploy-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy -- --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  health-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The admin key comes from the vault, not from a GitHub secret. Requires
      # two repo VARIABLES (non-secret): INFISICAL_MACHINE_ID and
      # INFISICAL_PROJECT_SLUG, plus a machine identity in Infisical whose
      # subject is repo:wazootech/worlds-api:ref:refs/heads/main. This fetches
      # into the job environment only; the deployed Worker's copy is owned by the
      # Cloudflare Workers Secret Sync, not by this step.
      - name: Fetch secrets from Infisical (qa)
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: "qa"
      - run: npm run health:local -- https://data-qa.wazoo.dev

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
